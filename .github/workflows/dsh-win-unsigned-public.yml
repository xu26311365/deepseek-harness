name: Package Desktop · Windows · x64 · unsigned · public runner

# Fork-only variant of the official self-hosted packaging flow:
# runs the same pnpm install + pnpm package:desktop:win:x64:unsigned on a public
# windows-2025 runner (MSVC/Python/tar preinstalled) and uploads the installer.
on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: windows-desktop-package-public
  cancel-in-progress: false

jobs:
  package:
    runs-on: windows-2025
    timeout-minutes: 180
    defaults:
      run:
        shell: pwsh
    env:
      DSH_DESKTOP_APP_ID: com.deepseek.dsh
      DSH_DESKTOP_PACKAGE_CACHE_DIR: D:\dsh-public-cache
      DSH_TELEMETRY_DISABLED: '1'
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@v5.0.0
        with:
          dest: ${{ runner.temp }}/setup-pnpm-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Set up Node
        uses: actions/setup-node@v7.0.0
        with:
          node-version: '^24.22.3'

      - name: Configure tool paths
        run: |
          New-Item -ItemType Directory -Path $env:DSH_DESKTOP_PACKAGE_CACHE_DIR -Force | Out-Null
          node -e "const os=require('node:os'); console.log(JSON.stringify({node:process.version,cpus:os.cpus().length,totalMemoryMB:Math.round(os.totalmem()/1048576)}))"
          pnpm store path
          exit $LASTEXITCODE

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
        env:
          PNPM_CONFIG_STORE_DIR: D:\dsh-public-cache\.pnpm-store

      - name: Write machine-local .env.windows (unsigned test-deployment preset)
        # The official self-hosted runner carries a hand-filled .env.windows (git ignored).
        # Public runners have no such file: generate the minimum unsigned test preset from
        # .env.windows.example. Policy validation still runs for win32 even when unsigned,
        # so the test-deployment origin + nonempty allowedAuthOrigins are required.
        run: |
          $envWin = Join-Path (Get-Location) 'apps\desktop\.env.windows'
          $content = @'
            DSH_DESKTOP_APP_ID=com.deepseek.dsh
            DSH_DESKTOP_AUTO_UPDATE_ENV=test
            DOWNLOAD_TEST_ORIGIN=https://download.example.com
            DSH_DESKTOP_MANDATORY_UPDATE_TEST_ORIGIN=https://download.example.com
            DSH_DESKTOP_MANDATORY_UPDATE_CONFIG='{"allowedAuthOrigins":["https://login.example.com"]}'
            DSH_DESKTOP_WINDOWS_COMPRESSION_LEVEL=3
          '@
          Set-Content -LiteralPath $envWin -Value $content -Encoding utf8
          Write-Host "wrote $envWin"

      - name: Build unsigned Windows x64 installer
        run: pnpm run package:desktop:win:x64:unsigned --build-version 0.2.3-alpha.2
        env:
          PNPM_CONFIG_STORE_DIR: D:\dsh-public-cache\.pnpm-store

      - name: List unsigned artifacts
        run: |
          $dir = 'apps\desktop\.desktop-build\targets\win-x64\unsigned-artifacts'
          Get-ChildItem -Recurse -File $dir | ForEach-Object { '{0}  {1} bytes' -f $_.FullName, $_.Length }

      - name: Upload installer
        # Upload only the NSIS installer; win-unpacked/ and the blockmap keep the local directory
        # but never reach the artifact, so it stays as small as the executable itself.
        uses: actions/upload-artifact@v7.0.1
        with:
          name: dsh-desktop-win-x64-unsigned-public
          path: apps/desktop/.desktop-build/targets/win-x64/unsigned-artifacts/dsh-desktop-*.exe
          retention-days: 14

      - name: Publish GitHub Release
        # Create one GitHub Release per round (tag dsh-win-x64-<run number>) with the NSIS
        # installer as its asset, so the binary survives beyond the 14-day artifact retention.
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $exe = Get-ChildItem 'apps\desktop\.desktop-build\targets\win-x64\unsigned-artifacts\dsh-desktop-*.exe' | Select-Object -First 1
          if ($exe -eq $null) { throw 'no unsigned NSIS installer found in the expected directory' }
          $runNumber = $env:GITHUB_RUN_NUMBER
          $tag = "dsh-win-x64-$runNumber"
          $api = 'https://api.github.com/repos/' + $env:GITHUB_REPOSITORY + '/releases'
          # Single-line YAML block: the whole body must stay inside the indented run
          # block; a double-quoted string that continues at column 0 would break the
          # YAML literal block and make GitHub reject the entire workflow.
          $bodyText = "DSH Desktop · Windows x64 (round $runNumber, unsigned build 0.2.3-alpha.2)`n`n"
          $bodyText += "- Installer: $($exe.Name) ($([math]::Round($exe.Length / 1MB, 1)) MB)`n"
          $bodyText += "- Build log: https://github.com/$($env:GITHUB_REPOSITORY)/actions/runs/$($env:GITHUB_RUN_ID)`n"
          $bodyText += "- Unsigned community build; run SmartScreen/antivirus as usual."
          $release = Invoke-WebRequest -Method Post -Uri $api `
            -Headers @{ Authorization = "token $env:GH_TOKEN"; Accept = 'application/vnd.github+json' } `
            -Body (@{ tag_name = $tag; name = "DSH Desktop win-x64 · round $runNumber"; prerelease = $true; target_commitish = $env:GITHUB_SHA; body = $bodyText } | ConvertTo-Json) `
            -ContentType 'application/json' -UseBasicParsing
          # GitHub returns a templated upload_url: either '.../assets{?name,label}'
          # (strip the brace template) or '.../assets?name={name}&label={label}'
          # (strip the whole query). Then pass the asset name explicitly.
          $rawUploadUrl = [string]((($release.Content | ConvertFrom-Json).upload_url))
          if ($rawUploadUrl -match '\{') {
            $uploadUrl = $rawUploadUrl -replace '\{.*$', ''
          } else {
            $uploadUrl = $rawUploadUrl -replace '\?.*$', ''
          }
          if ($uploadUrl -eq '') { throw "release creation did not return a usable upload_url: $rawUploadUrl" }
          curl.exe -sSL -f -X POST -H "Authorization: token $env:GH_TOKEN" -H 'Content-Type: application/octet-stream' `
            "--data-binary @$($exe.FullName)" "$($uploadUrl)?name=$([uri]::EscapeDataString($exe.Name))"
          if ($LASTEXITCODE -ne 0) { throw "release asset upload failed (exit $LASTEXITCODE)" }
          Write-Host "published release $tag with $($exe.Name)"
